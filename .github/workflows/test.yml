name: CollieSocket contract checkpoint

on:
  push:
    branches: [work/encrypted-push-v1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: colliesocket-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract and independent sender evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned verifiers
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          python3 -m pip install -r contracts/encrypted-push/v1/tools/requirements.txt -r crates/colliesocket-push/tools/requirements.txt
      - name: Frozen contract conformance
        run: python3 contracts/encrypted-push/v1/tools/conformance.py
      - name: Enrollment v2 and independent control-frame conformance
        run: python3 contracts/encrypted-push/v2/tools/conformance.py
      - run: python3 contracts/encrypted-push/v3/tools/conformance.py
      - name: Clippy for the push crate, tests and fixture generator
        run: cargo +1.90.0 clippy --locked --manifest-path crates/colliesocket-push/Cargo.toml --all-targets --no-deps
      - name: Published vector and independent decryption
        run: |
          cargo +1.90.0 fmt --manifest-path crates/colliesocket-push/Cargo.toml -- --check
          sh crates/colliesocket-push/tools/conformance.sh
          python3 crates/colliesocket-push/tools/check_fixtures.py contracts/encrypted-push/v1/fixtures/crypto

  server:
    name: Server unit and synthetic CLI checks
    needs: contract
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned verifier and toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          python3 -m pip install -r contracts/encrypted-push/v1/tools/requirements.txt -r crates/colliesocket-push/tools/requirements.txt
      - name: Format, public image pins and locked unit tests
        run: |
          cargo +1.90.0 fmt --all -- --check
          python3 tools/image/check-pins.py
          cargo +1.90.0 test --locked
      - name: Clippy for the server and tests
        run: cargo +1.90.0 clippy --locked --all-targets --no-deps
      - name: Synthetic CLI, transport and independent decryption
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.90.0 build --locked
          python3 tests/check_signal_overrides_absent.py --binary target/debug/mollysocket
          python3 tests/server_cli.py --binary target/debug/mollysocket --output "$RUNNER_TEMP/colliesocket-server-cli.json"
      - name: Preserve redacted synthetic result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: colliesocket-server-cli-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/colliesocket-server-cli.json
          if-no-files-found: ignore
          retention-days: 1

  signal:
    name: Fake Signal delivery and release isolation
    needs: contract
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned verifier and toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          python3 -m pip install -r crates/colliesocket-push/tools/requirements.txt
      - name: Test-only configuration and real websocket delivery
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.90.0 test --locked --features test-signal
          cargo +1.90.0 build --locked --features test-signal
          python3 tests/signal_e2e.py --binary target/debug/mollysocket --output "$RUNNER_TEMP/colliesocket-signal-e2e.json"
      - name: Clippy for the test-only Signal feature
        run: cargo +1.90.0 clippy --locked --all-targets --features test-signal --no-deps
      - name: Release excludes overrides with all features and debug assertions
        env:
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.90.0 build --locked --release --all-features
          python3 tests/check_signal_overrides_absent.py --binary target/release/mollysocket --output "$RUNNER_TEMP/colliesocket-signal-release.json"
      - name: Preserve redacted Signal results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: colliesocket-signal-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/colliesocket-signal-e2e.json
            ${{ runner.temp }}/colliesocket-signal-release.json
          if-no-files-found: ignore
          retention-days: 1

  image:
    name: Local image ${{ matrix.platform }}
    needs: [server, signal]
    if: github.event.repository.private == false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Native builder with verified BuildKit image
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.38.2
          platforms: ${{ matrix.platform }}
          driver-opts: image=docker.io/moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
          buildkitd-flags: --oci-worker=true
          cache-binary: false
      - name: Build local archive and run isolated packaging smoke
        env:
          COLLIESOCKET_BUILDER: ${{ steps.buildx.outputs.name }}
        run: bash tools/image/build.sh '${{ matrix.platform }}' 'colliesocket:test-${{ matrix.arch }}' "$RUNNER_TEMP/colliesocket-image-${{ matrix.arch }}"
      - name: Preserve candidate image and redacted results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: colliesocket-image-${{ matrix.arch }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/colliesocket-image-${{ matrix.arch }}/image.tar.gz
            ${{ runner.temp }}/colliesocket-image-${{ matrix.arch }}/image-build.json
            ${{ runner.temp }}/colliesocket-image-${{ matrix.arch }}/image-smoke.json
          if-no-files-found: ignore
          retention-days: 1
