name: CollieSocket contract checkpoint

on:
  push:
    branches: [work/encrypted-push-v1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: colliesocket-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract and independent sender evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned verifiers
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt
          python3 -m pip install -r contracts/encrypted-push/v1/tools/requirements.txt -r crates/colliesocket-push/tools/requirements.txt
      - name: Frozen contract conformance
        run: python3 contracts/encrypted-push/v1/tools/conformance.py
      - name: Published vector and independent decryption
        run: |
          cargo +1.90.0 fmt --manifest-path crates/colliesocket-push/Cargo.toml -- --check
          sh crates/colliesocket-push/tools/conformance.sh
          python3 crates/colliesocket-push/tools/check_fixtures.py contracts/encrypted-push/v1/fixtures/crypto
